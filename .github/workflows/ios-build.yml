name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # Xcode 14.2 + iOS 16 SDK。构建产物向下兼容 iOS 15+，向上兼容 iOS 26
    runs-on: macos-13
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen 并生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 构建未签名 App（arm64 通用，兼容 iOS 15~26）
        run: |
          xcodebuild -project LocationRecorder.xcodeproj \
            -scheme LocationRecorder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: 打包为 IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LocationRecorder.app Payload/
          zip -qr LocationRecorder-unsigned.ipa Payload

      - name: 上传构建产物（IPA）
        uses: actions/upload-artifact@v4
        with:
          name: LocationRecorder-ipa
          path: LocationRecorder-unsigned.ipa
          retention-days: 30
